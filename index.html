<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Filmes Que Vi</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <header class="site-header">
            <h1>Filmes que vi</h1>
            <p>Uma pequena lista dos filmes que já assisti.</p>
        </header>

        <!-- filtros (os botões são criados pelo JavaScript a partir das categorias dos filmes) -->
        <nav class="filters" id="filters" aria-label="Filtrar por categoria"></nav>

        <p class="result-count" id="result-count" aria-live="polite"></p>

        <!-- lista de filmes -->
        <main class="catalog-container" id="catalog">
            <!-- os filmes serão inseridos aqui pelo javascript -->
        </main>

        <script src="movies.js"></script>
        <script src="script.js"></script>
    </body>
</html>
